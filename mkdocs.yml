site_name: EGR 314 Isaiah Johnston Datasheet
site_url: https://isaiahcmd.github.io/Isaiahcmd-EGR314.github.io/
repo_url: https://github.com/Isaiahcmd/Isaiahcmd-EGR314.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: custom_theme/partials
  palette:
    primary: blue
    accent: indigo
  font:
    text: Roboto
  logo: static/logo314.svg
  favicon: static/logo314.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tabs.overflow
    - toc.follow
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.expand
    - content.action.edit
    - navigation.footer

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

not_in_nav: |
  static

copyright: "Copyright © 2026 Isaiah Johnston"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2026_spring
      name: 2023 Site

nav:
  - Home: index.md
  - Requirements: 01-Requirements/Requirements.md
  - Block Diagram: 02-Block-Diagram/Block-Diagram.md
  - Component Selection: 03-Component-Selection/Component-Selection.md
  - Microcontroller Selection: 04-Microcontroller-Selection/Microcontroller-Selection.md
  - Power Budget: 05-Power-Budget/Power-Budget.md
  - BOM: 06-BOM/BOM.md
  - Schematic: 07-Schematic/schematic.md
  - PCB: 08-PCB/pcb.md
  - Reflection: 09-Reflection/Reflection.md
  - API: 10-API/test2.md
  - Appendix: Appendix/index.md
